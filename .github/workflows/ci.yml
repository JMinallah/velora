name: CI

# One run per change: PRs are checked via pull_request, merges via push to
# main. (Pushing feature branches too used to run everything twice per PR.)
# workflow_dispatch runs the full suite, evals included, on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Single-node replica set: multi-document transactions (accepting a plan
      # applies all of its changes or none) need one. Atlas always is one.
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      # A service container can't pass --replSet, so start MongoDB here.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Browser tests of the zero-AI baseline against a production build
      # (docs/06-DELIVERY-PLAN.md 2.5 exit gate). Runs with AI disabled.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Evals call the real model and spend free-tier quota (~10 requests,
      # ~2 min), so they run only when the change can affect the agent: its
      # code, the domain layer its tools call, the eval suite, or dependencies.
      - name: Detect agent-affecting changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$base" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD \
             | grep -qE '^(src/agent/|src/domain/|evals/|src/lib/env\.ts$|package(-lock)?\.json$)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

      # Merge-blocking when they run: a missing key fails instead of skipping.
      - name: Agent evals
        if: steps.changes.outputs.agent == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Agent-affecting change but the GEMINI_API_KEY secret is not set"
            exit 1
          fi
          npm run evals

      # Shipped code is held to high+; dev tooling to critical. Dev-only highs
      # can be unpatchable upstream (e.g. braces via eslint-config-next, which
      # only ever globs our own lint config) and would otherwise block every merge.
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (critical)
        run: npm audit --audit-level=critical
