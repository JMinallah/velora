name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Agent evals (skips without GEMINI_API_KEY secret)
        run: npm run evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Shipped code is held to high+; dev tooling to critical. Dev-only highs
      # can be unpatchable upstream (e.g. braces via eslint-config-next, which
      # only ever globs our own lint config) and would otherwise block every merge.
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (critical)
        run: npm audit --audit-level=critical
